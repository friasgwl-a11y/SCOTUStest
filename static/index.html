<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#1f3a63" />
<title>SCOTUS Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231f3a63'/%3E%3Cpath fill='%23fff' d='M12 3c.4 0 .7.2.9.5l1.4 2.3 3.6.6c.7.1 1 1 .5 1.5l-2.6 2.6.6 3.6c.1.7-.6 1.2-1.2.9L12 13.9l-3.2 1.7c-.6.3-1.3-.2-1.2-.9l.6-3.6-2.6-2.6c-.5-.5-.2-1.4.5-1.5l3.6-.6L11.1 3.5c.2-.3.5-.5.9-.5z'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/styles.css" />
<script>
  // Applied synchronously, before first paint, so a saved theme choice
  // never flashes the wrong palette on load.
  (function () {
    try {
      var saved = localStorage.getItem("scotus-theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a href="/" data-link class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v18M5 21h14M5 7l-3 5a4 4 0 0 0 6 0l-3-5zm14 0l-3 5a4 4 0 0 0 6 0l-3-5zM5 7h14M12 3l3 4M12 3L9 7"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-title">SCOTUS Tracker</span>
        <span class="tagline">Supreme Court of the United States</span>
      </span>
    </a>

    <nav class="main-nav" aria-label="Primary">
      <a href="/" data-link data-nav="home">Home</a>
      <a href="/opinions" data-link data-nav="opinions">Opinions</a>
      <a href="/orders" data-link data-nav="orders">Orders</a>
    </nav>

    <div class="topbar-actions">
      <span id="lastRun" class="last-run">&mdash;</span>
      <button id="themeToggle" class="icon-btn theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button id="refreshBtn" class="btn btn-primary">Refresh now</button>
    </div>
  </div>
</header>

<div id="errorBanner" class="error-banner hidden" role="alert"></div>

<main id="app" class="container"></main>

<footer class="site-footer">
  <p>Data sourced directly from <a href="https://www.supremecourt.gov" target="_blank" rel="noopener">supremecourt.gov</a>. Summaries are generated automatically (extractive by default, or via Claude when configured) and may contain errors &mdash; always verify against the official PDF.</p>
</footer>

<script src="/app.js"></script>
</body>
</html>
