<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0f0a" />
<title>SCOTUS Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%230a0f0a'/%3E%3Crect x='3' y='1' width='2' height='1' fill='%234ade80'/%3E%3Crect x='1' y='2' width='6' height='1' fill='%234ade80'/%3E%3Crect x='3' y='3' width='2' height='2' fill='%234ade80'/%3E%3Crect x='0' y='4' width='3' height='1' fill='%234ade80'/%3E%3Crect x='5' y='4' width='3' height='1' fill='%234ade80'/%3E%3Crect x='2' y='6' width='4' height='1' fill='%234ade80'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<script>
  // Applied synchronously, before first paint, so a saved theme choice
  // never flashes the wrong palette on load.
  (function () {
    try {
      var saved = localStorage.getItem("scotus-theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a href="/" data-link class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="currentColor" shape-rendering="crispEdges">
          <rect x="7" y="0" width="2" height="2"/>
          <rect x="7" y="2" width="2" height="6"/>
          <rect x="2" y="3" width="12" height="2"/>
          <rect x="3" y="5" width="1" height="3"/>
          <rect x="12" y="5" width="1" height="3"/>
          <rect x="0" y="8" width="7" height="1"/>
          <rect x="0" y="9" width="1" height="1"/>
          <rect x="6" y="9" width="1" height="1"/>
          <rect x="1" y="10" width="5" height="1"/>
          <rect x="9" y="8" width="7" height="1"/>
          <rect x="15" y="9" width="1" height="1"/>
          <rect x="9" y="9" width="1" height="1"/>
          <rect x="10" y="10" width="5" height="1"/>
          <rect x="6" y="11" width="4" height="2"/>
          <rect x="4" y="13" width="8" height="2"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-title">SCOTUS Tracker</span>
        <span class="tagline">Supreme Court of the United States</span>
      </span>
    </a>

    <nav class="main-nav" aria-label="Primary">
      <a href="/" data-link data-nav="home">Home</a>
      <a href="/opinions" data-link data-nav="opinions">Opinions</a>
      <a href="/orders" data-link data-nav="orders">Orders</a>
    </nav>

    <div class="topbar-actions">
      <span id="lastRun" class="last-run">&mdash;</span>
      <button id="themeToggle" class="icon-btn theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button id="refreshBtn" class="btn btn-primary">Refresh now</button>
    </div>
  </div>
</header>

<div id="errorBanner" class="error-banner hidden" role="alert"></div>

<main id="app" class="container"></main>

<footer class="site-footer">
  <p>Data sourced directly from <a href="https://www.supremecourt.gov" target="_blank" rel="noopener">supremecourt.gov</a>. Summaries are generated automatically (extractive by default, or via Claude when configured) and may contain errors &mdash; always verify against the official PDF.</p>
</footer>

<script src="/app.js"></script>
</body>
</html>
